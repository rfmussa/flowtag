[package]
name = "onetagger-db"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
dunce = "1.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.5"
lofty = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }

onetagger-tag = { path = "../onetagger-tag" }
rusqlite_migration = "2.3.0"

[dev-dependencies]
tempfile = "3"
